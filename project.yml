name: Guillotine
options:
  bundleIdPrefix: dev.guillotine
  deploymentTarget:
    macOS: '13.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    # No App Intents or App Shortcuts are defined; omit their metadata build task.
    LM_SKIP_METADATA_EXTRACTION: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    MACOSX_DEPLOYMENT_TARGET: '13.0'
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    MARKETING_VERSION: '1.0.1'
    CURRENT_PROJECT_VERSION: '18'
targets:
  Guillotine:
    type: application
    platform: macOS
    sources:
      - path: Sources/Guillotine
      - path: Resources
        excludes: [Info.plist, LaunchDaemons]
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Guillotine
        LSUIElement: true
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: Copyright © 2026 Guillotine contributors
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.guillotine.Guillotine
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: GuillotineGuard
        embed: false
      - target: GuillotineLidHelper
        embed: false
      - sdk: IOKit.framework
      - sdk: Carbon.framework
      - sdk: ServiceManagement.framework
    postBuildScripts:
      - name: Embed hardware guard
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          cp "$BUILT_PRODUCTS_DIR/GuillotineGuard" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/GuillotineGuard"
          cp "$BUILT_PRODUCTS_DIR/GuillotineLidHelper" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/GuillotineLidHelper"
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchDaemons"
          cp "$SRCROOT/Resources/LaunchDaemons/dev.guillotine.LidHelper.plist" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchDaemons/"
        inputFiles: ["$(BUILT_PRODUCTS_DIR)/GuillotineGuard", "$(BUILT_PRODUCTS_DIR)/GuillotineLidHelper", "$(SRCROOT)/Resources/LaunchDaemons/dev.guillotine.LidHelper.plist"]
        outputFiles: ["$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/GuillotineGuard", "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/GuillotineLidHelper", "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchDaemons/dev.guillotine.LidHelper.plist"]
  GuillotineGuard:
    type: tool
    platform: macOS
    sources: [Sources/GuillotineGuard]
    settings:
      base:
        CLANG_ENABLE_OBJC_ARC: YES
        CODE_SIGNING_ALLOWED: YES
    dependencies:
      - sdk: AppKit.framework
      - sdk: CoreAudio.framework
      - sdk: CoreGraphics.framework
      - sdk: IOKit.framework
  GuillotineLidHelper:
    type: tool
    platform: macOS
    sources: [Sources/GuillotineLidHelper]
    settings:
      base:
        CLANG_ENABLE_OBJC_ARC: YES
        CODE_SIGNING_ALLOWED: YES
    dependencies:
      - sdk: Foundation.framework
      - sdk: IOKit.framework
      - sdk: SystemConfiguration.framework
  GuillotineTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/GuillotineTests]
    dependencies:
      - target: Guillotine
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Xcode 27 ships XCTest with a macOS 14 minimum; the app still supports 13.
        MACOSX_DEPLOYMENT_TARGET: '14.0'
schemes:
  Guillotine:
    build:
      targets:
        Guillotine: all
    test:
      targets: [GuillotineTests]
