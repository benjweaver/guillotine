name: Guillotine
options:
  bundleIdPrefix: dev.guillotine
  deploymentTarget:
    macOS: '13.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '13.0'
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '5'
targets:
  Guillotine:
    type: application
    platform: macOS
    sources:
      - path: Sources/Guillotine
      - path: Resources
        excludes: [Info.plist]
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Guillotine
        LSUIElement: true
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: Copyright © 2026 Guillotine contributors
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.guillotine.Guillotine
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: GuillotineGuard
        embed: false
      - sdk: IOKit.framework
      - sdk: Carbon.framework
      - sdk: ServiceManagement.framework
    postBuildScripts:
      - name: Embed hardware guard
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          cp "$BUILT_PRODUCTS_DIR/GuillotineGuard" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/GuillotineGuard"
        inputFiles: ["$(BUILT_PRODUCTS_DIR)/GuillotineGuard"]
        outputFiles: ["$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/GuillotineGuard"]
  GuillotineGuard:
    type: tool
    platform: macOS
    sources: [Sources/GuillotineGuard]
    settings:
      base:
        CLANG_ENABLE_OBJC_ARC: YES
        CODE_SIGNING_ALLOWED: YES
    dependencies:
      - sdk: AppKit.framework
      - sdk: IOKit.framework
  GuillotineTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/GuillotineTests]
    dependencies:
      - target: Guillotine
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Guillotine:
    build:
      targets:
        Guillotine: all
    test:
      targets: [GuillotineTests]
