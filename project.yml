name: Guillotine
options:
  bundleIdPrefix: dev.guillotine
  deploymentTarget:
    macOS: '13.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '13.0'
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Guillotine:
    type: application
    platform: macOS
    sources: [Sources/Guillotine]
    resources: [Resources/Assets.xcassets, Resources/HeadlessGuide.txt, LICENSE]
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Guillotine
        LSUIElement: true
        NSHumanReadableCopyright: Copyright © 2026 Guillotine contributors
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.guillotine.Guillotine
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: IOKit.framework
      - sdk: Carbon.framework
      - sdk: ServiceManagement.framework
  GuillotineTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/GuillotineTests]
    dependencies:
      - target: Guillotine
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Guillotine:
    build:
      targets:
        Guillotine: all
    test:
      targets: [GuillotineTests]
